[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillkernel"
version = "0.1.0"
description = "A project-agnostic engineering intelligence layer: evidence-gated skill discovery, validation and promotion."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.scripts]
skillkernel = "skillkernel.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["skillkernel*"]

[tool.setuptools.package-data]
skillkernel = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "acceptance: end-to-end vertical-slice acceptance tests",
  "integration: multi-component integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["skillkernel", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RET", "ARG", "PTH", "TID", "RUF"]
ignore = ["RET504"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.11"
files = ["skillkernel", "tests"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true
